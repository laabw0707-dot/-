<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص PWA</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon-32.png">
<style>
body{margin:0;padding:18px;font:16px/1.7 system-ui,"Segoe UI",Tahoma,sans-serif;background:#f4f4f2;color:#1b2420}
h1{font-size:22px;margin:0 0 14px}h2{font-size:17px;margin:22px 0 8px}
.r{display:flex;gap:10px;align-items:center;padding:9px 12px;margin:6px 0;background:#fff;border-radius:12px;border:1px solid #ddd}
.r b{flex:1;word-break:break-all;font-weight:600}.r i{font-style:normal;font-size:13px;color:#667}
.ok{border-color:#3a9d6e}.ok::before{content:"✅"}.no{border-color:#c0432f}.no::before{content:"❌"}.wa{border-color:#c9a44c}.wa::before{content:"⚠️"}
#sum{padding:12px 14px;border-radius:14px;font-weight:700;background:#fff;border:2px solid #ccc}
button{font:inherit;padding:10px 16px;border-radius:12px;border:0;background:#0f5a48;color:#fff;margin-top:14px}
</style></head><body>
<h1>فحص التطبيق (PWA)</h1><div id="sum">جارٍ الفحص…</div>
<h2>الملفات</h2><div id="files"></div>
<h2>Service Worker</h2><div id="sw"></div>
<h2>Manifest</h2><div id="mf"></div>
<h2>التخزين</h2><div id="st"></div>
<button onclick="location.reload()">إعادة الفحص</button>
<script>
var FILES=["index.html","manifest.webmanifest","sw.js","storage.js","check.html","icon-192.png","icon-512.png","maskable-192.png","maskable-512.png","apple-touch-icon.png","favicon-32.png"];
var bad=0,warn=0;
function row(id,s,t,n){var d=document.createElement("div");d.className="r "+s;d.innerHTML="<b></b><i></i>";d.firstChild.textContent=t;d.lastChild.textContent=n||"";document.getElementById(id).appendChild(d);if(s=="no")bad++;if(s=="wa")warn++}
function img(u){return new Promise(function(ok){var i=new Image();i.onload=function(){ok([i.naturalWidth,i.naturalHeight])};i.onerror=function(){ok(null)};i.src=u+"?c="+Date.now()})}
async function run(){
  for(var f of FILES){try{var r=await fetch(f,{cache:"no-store"});row("files",r.ok?"ok":"no",f,r.ok?(r.headers.get("content-length")||"")+" B":"HTTP "+r.status)}catch(e){row("files","no",f,"غير موجود")}}
  if(!("serviceWorker" in navigator))row("sw","no","المتصفح لا يدعم Service Worker");
  else{
    var reg=await navigator.serviceWorker.getRegistration();
    if(!reg){try{reg=await navigator.serviceWorker.register("sw.js",{scope:"./"});await navigator.serviceWorker.ready}catch(e){row("sw","no","فشل التسجيل",String(e))}}
    if(reg){row("sw","ok","مسجّل","النطاق: "+reg.scope);var w=reg.active||reg.waiting||reg.installing;row("sw",w&&w.state=="activated"?"ok":"wa","الحالة: "+(w?w.state:"—"));
      row("sw",navigator.serviceWorker.controller?"ok":"wa","يتحكم بهذه الصفحة",navigator.serviceWorker.controller?"":"أعد تحميل الصفحة مرة");
      var ks=await caches.keys();var n=0;for(var k of ks){n+=(await (await caches.open(k)).keys()).length}row("sw",n?"ok":"no","الكاش: "+ks.join(", "),n+" ملف")}
  }
  try{
    var m=await (await fetch("manifest.webmanifest",{cache:"no-store"})).json();
    ["name","short_name","start_url","scope","display","lang","dir"].forEach(function(k){row("mf",m[k]?"ok":"no",k+" = "+(m[k]||"مفقود"))});
    row("mf",m.display=="standalone"?"ok":"no","display standalone");
    var ic=m.icons||[];var has={};
    for(var x of ic){var d=await img(x.src);var ok=d&&(x.sizes==d[0]+"x"+d[1]);has[x.sizes+x.purpose]=ok;row("mf",ok?"ok":"no",x.src+" ("+x.purpose+")",d?d[0]+"x"+d[1]:"لا يُحمَّل");if(/\//.test(x.src))row("mf","wa","المسار يحتوي مجلداً",x.src)}
    row("mf",has["192x192any"]&&has["512x512any"]?"ok":"no","أيقونات 192 و512");
    row("mf",has["192x192maskable"]&&has["512x512maskable"]?"ok":"wa","أيقونات maskable");
  }catch(e){row("mf","no","manifest غير صالح",String(e))}
  row("st",isSecureContext?"ok":"no","سياق آمن (HTTPS)");
  row("st",matchMedia("(display-mode: standalone)").matches?"ok":"wa","يعمل كتطبيق مثبّت","إن فتحته من المتصفح فهذا طبيعي");
  if(navigator.storage&&navigator.storage.persisted){var p=await navigator.storage.persisted();row("st",p?"ok":"wa","تخزين دائم (persist)",p?"":"قد يمنحه المتصفح بعد الاستخدام أو التثبيت")}
  try{var rec=window.PWAStorage?await PWAStorage.get():null;row("st",rec?"ok":"wa","نسخة IndexedDB",rec?new Date(rec.t).toLocaleString("ar")+" · "+Object.keys(rec.data).length+" مفتاح":"لا توجد بعد (افتح التطبيق أولاً)")}catch(e){row("st","no","IndexedDB",String(e))}
  var s=document.getElementById("sum");s.textContent=bad?("❌ "+bad+" مشكلة"):warn?("⚠️ جاهز مع "+warn+" تنبيه"):"✅ كل شيء سليم";s.style.borderColor=bad?"#c0432f":warn?"#c9a44c":"#3a9d6e"
}
</script><script src="storage.js"></script><script>run()</script>
</body></html>
