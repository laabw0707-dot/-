<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص PWA</title>
<style>body{font:16px system-ui,sans-serif;margin:0;padding:16px;background:#f4f1e8;color:#14201c}h1{font-size:20px;margin:0 0 12px}.r{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;margin:6px 0;border-radius:10px;background:#fff;border:1px solid #ddd}.ok{border-color:#2f9a82}.bad{border-color:#d0634f;background:#fff3f0}.s{font-weight:700;white-space:nowrap}.ok .s{color:#17806a}.bad .s{color:#c0392b}h2{font-size:15px;margin:16px 0 4px;color:#0f5a48}small{color:#666;word-break:break-all}button{padding:10px 16px;border:0;border-radius:99px;background:#0f5a48;color:#fff;font:inherit;margin-top:12px}</style></head><body>
<h1>فحص PWA — رفيق</h1><div id="sum" class="r"><span>جارٍ الفحص…</span></div><div id="out"></div><button onclick="location.reload()">إعادة الفحص</button>
<script>
var FILES=['index.html','manifest.webmanifest','sw.js','storage.js','icon-192.png','icon-512.png','maskable-192.png','maskable-512.png','apple-touch-icon.png','favicon-32.png','check.html'];
var out=document.getElementById('out'),bad=0,total=0;
function sec(t){var h=document.createElement('h2');h.textContent=t;out.appendChild(h)}
function row(name,ok,note){total++;if(!ok)bad++;var d=document.createElement('div');d.className='r '+(ok?'ok':'bad');d.innerHTML='<span>'+name+(note?'<br><small>'+note+'</small>':'')+'</span><span class="s">'+(ok?'✓ موجود':'✗ مشكلة')+'</span>';out.appendChild(d)}
function imgSize(u){return new Promise(function(r){var i=new Image();i.onload=function(){r(i.naturalWidth+'x'+i.naturalHeight)};i.onerror=function(){r(null)};i.src=u+'?c='+Date.now()})}
(async function(){
 sec('الملفات');
 for(var f of FILES){try{var r=await fetch(f,{cache:'no-store'});row(f,r.ok,r.ok?'':'HTTP '+r.status)}catch(e){row(f,false,'تعذّر التحميل')}}
 sec('Manifest');
 try{
  var m=await (await fetch('manifest.webmanifest',{cache:'no-store'})).json();
  row('name / short_name',!!(m.name&&m.short_name),m.name+' / '+m.short_name);
  row('start_url = ./index.html',m.start_url==='./index.html',m.start_url);
  row('scope = ./',m.scope==='./',m.scope);
  row('display = standalone',m.display==='standalone',m.display);
  row('lang = ar , dir = rtl',m.lang==='ar'&&m.dir==='rtl',m.lang+' , '+m.dir);
  var ic=m.icons||[],has=function(s,p){return ic.some(function(i){return i.sizes===s&&(i.purpose||'any').indexOf(p)>-1})};
  row('أيقونات 192 و 512 (any)',has('192x192','any')&&has('512x512','any'));
  row('أيقونات maskable',has('192x192','maskable')&&has('512x512','maskable'));
  row('مسارات الأيقونات مسطّحة',ic.every(function(i){return i.src.indexOf('/')<0}),ic.map(function(i){return i.src}).join(' , '));
  for(var i of ic){var sz=await imgSize(i.src);row(i.src,sz===i.sizes,'الحجم الفعلي: '+(sz||'—'))}
 }catch(e){row('قراءة manifest',false,String(e))}
  sec('Service Worker');
 row('المتصفح يدعم SW','serviceWorker' in navigator);
 row('اتصال آمن (HTTPS)',isSecureContext,location.protocol);
 if('serviceWorker' in navigator){
  try{
   var reg=await navigator.serviceWorker.getRegistration('./');
   if(!reg){reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'})}
   await navigator.serviceWorker.ready;
   row('تسجيل sw.js',!!reg,'scope: '+reg.scope);
   row('SW يتحكم بالصفحة',!!navigator.serviceWorker.controller,navigator.serviceWorker.controller?'':'حدّث الصفحة مرة واحدة');
   var keys=await caches.keys();row('الكاش مُنشأ',keys.length>0,keys.join(' , '));
   if(keys.length){var c=await caches.open(keys[0]);var miss=[];for(var f of ['./','./index.html','./manifest.webmanifest','./storage.js','./icon-192.png','./icon-512.png']){if(!await c.match(f))miss.push(f)}row('الملفات الأساسية مخزّنة مسبقًا',!miss.length,miss.join(' , '))}
  }catch(e){row('تسجيل sw.js',false,String(e))}
 }
 sec('التخزين');
 try{var p=await navigator.storage.persisted();row('التخزين الدائم (persist)',true,p?'ممنوح':'لم يُمنح بعد — يُمنح عادةً بعد التثبيت/الاستخدام')}catch(e){row('التخزين الدائم',false,String(e))}
 try{var db=await new Promise(function(ok,no){var q=indexedDB.open('rafiq-ls-backup',1);q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error)}});
  var has=db.objectStoreNames.contains('kv');var v=has?await new Promise(function(ok){var g=db.transaction('kv').objectStore('kv').get('snapshot');g.onsuccess=function(){ok(g.result)};g.onerror=function(){ok(null)}}):null;db.close();
  row('نسخة IndexedDB الاحتياطية',true,v?'آخر نسخة: '+new Date(v.t).toLocaleString('ar'):'تُنشأ بعد فتح التطبيق وحفظ بيانات');
 }catch(e){row('نسخة IndexedDB الاحتياطية',false,String(e))}
 var s=document.getElementById('sum');s.className='r '+(bad?'bad':'ok');s.innerHTML='<span>النتيجة: '+(total-bad)+' / '+total+'</span><span class="s">'+(bad?'✗ يوجد مشاكل':'✓ كل شيء سليم')+'</span>';
})();
</script></body></html>
