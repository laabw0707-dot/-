const IV=[0,1,3,7,14,30];
const rate=(c,l)=>{if(l==='h')return{box:Math.max(1,c.box-1),d:1};const b=Math.min(5,c.box+(l==='m'?1:2));return{box:b,d:IV[b]}};
const dlab=d=>d===1?'غدًا':d+' يوم';

const mast=sj=>{const l=S.cards.filter(c=>c.subj===sj);return l.length?Math.round(l.filter(c=>c.box>=4).length/l.length*100):0};
const fszc=()=>`<div class="chips" style="justify-content:center">${[['s','صغير'],['m','متوسط'],['l','كبير']].map(([k,t])=>`<button class="chip${(S.fs||'m')===k?' on':''}" data-a="fsz" data-v="${k}">${t}</button>`).join('')}</div>`;
const CIU={};
const cimg=(c,x)=>c.img?`<img class="cimg${x||''}" data-ci="${c.id}" alt=""${CIU[c.id]?` src="${CIU[c.id]}"`:''}>`:'';

   ${cardFlip?`<div class="rt3">${[['h','صعبة'],['m','متوسطة'],['e','سهلة']].map(([l,t])=>`<button class="rt rt-${l}" data-a="crate" data-l="${l}" data-id="${c.id}">${t}<small>${dlab(rate(c,l).d)}</small></button>`).join('')}</div><div class="row" style="justify-content:center"><button class="b s sm" data-a="cno" data-id="${c.id}">لم أعرفها، أعدها الآن</button></div>`:'<div class="mut" style="text-align:center">اضغط البطاقة لإظهار الإجابة</div>'}
   ${c.subj?`<div class="mut" style="text-align:center;margin-top:10px">إتقان ${esc(c.subj)}: ${mast(c.subj)}%</div><div class="bar" style="max-width:320px;margin:4px auto"><i style="width:${mast(c.subj)}%"></i></div>`:''}`}
 }else if(cardTab==='errs'){body=errView()}else if(cardTab==='mcq'){body=mqView()}else if(cardTab==='add'){
  body=`<div class="card cap"><div class="lb">المادة</div>${chips('cs')}<textarea id="cq" style="min-height:90px" placeholder="السؤال"></textarea><br><br><textarea id="ca" style="min-height:90px" placeholder="الجواب"></textarea><br><br><button class="b" data-a="addcard">حفظ البطاقة</button> <button class="b s" data-a="icards">استيراد من نص</button></div>`;
 }else{const ms=S.subjects.filter(x=>S.cards.some(c=>c.subj===x));body=(ms.length?`<div class="card" style="margin-bottom:12px"><h3>الإتقان لكل مادة</h3>${ms.map(x=>`<div class="mut" style="display:flex;justify-content:space-between"><span>${esc(x)}</span><span>${mast(x)}%</span></div><div class="bar" style="margin:4px 0 10px"><i style="width:${mast(x)}%"></i></div>`).join('')}</div>`:'')+(S.cards.length?`<div class="cgrid">${S.cards.map((c,i)=>`<div class="cm" style="--i:${i}"><button class="x" data-a="delcard" data-id="${c.id}" aria-label="حذف">✕</button><div class="cq">${cimg(c,' sm')}${esc(c.q)}</div><div class="fmeta">${c.subj?`<span class="tag" style="${sty(c.subj)}">${esc(c.subj)}</span>`:''}<span class="lv">${[1,2,3,4,5].map(n=>`<i${n<=c.box?' class="on"':''}></i>`).join('')}</span></div></div>`).join('')}</div>`:'<div class="card mut">لا توجد بطاقات</div>')}
 return `<h2>البطاقات التعليمية</h2><div class="tabs">${[['study','مراجعة'],['exam','وضع الامتحان'],['errs','الأخطاء'],['mcq','اختيار متعدد'],['add','إضافة'],['all','الكل ('+S.cards.length+')']].map((t,i)=>`<button style="--i:${i}" class="b ${cardTab===t[0]||(t[0]==='errs'&&cardTab==='errr')?'on':'s'} sm" data-a="ctab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${(cardTab==='study'||em||xm)?fszc():''}${body}`};

V.sched=()=>{
 const t=DAYS[new Date().getDay()];
 if(schedDay){
  const d=schedDay,l=S.sched.filter(x=>x.day===d).sort((a,b)=>a.time<b.time?-1:1);
  return `<div class="bk"><button class="b s sm" data-a="sback">→ الجدول</button></div><h2>${d}${d===t?' <span class="tag">اليوم</span>':''}</h2><div class="row"><button class="b addbtn" data-a="nslot">＋ إضافة حصة</button></div>
  ${l.length?`<div class="mut" style="margin:0 6px 12px">اضغط مطولًا على الحصة لتعديلها</div>`:''}
  <div class="dlist">${l.length?l.map((s,i)=>`<div class="ls dls" data-id="${s.id}" style="--i:${i};border-inline-start-color:${sc(s.subj)}"><span class="tm">${esc(s.time)}</span><b class="ln">${esc(s.subj||'—')}</b>${s.room?`<span class="tag">${esc(s.room)}</span>`:''}<button class="x" data-a="delslot" data-id="${s.id}" aria-label="حذف">✕</button></div>`).join(''):'<div class="card mut em">لا توجد حصص في هذا اليوم</div>'}</div>`}
 const tabsv=`<div class="tabs">${[['days','الأيام'],['week','الأسبوع']].map((v,i)=>`<button style="--i:${i}" class="b ${schedView===v[0]?'on':'s'} sm" data-a="sview" data-v="${v[0]}">${v[1]}</button>`).join('')}</div>`;
 let body;
 if(schedView==='week'){
  const hs=S.sched.map(x=>+x.time.slice(0,2));
  if(!hs.length)body='<div class="card mut em">لا توجد حصص بعد. أضف أول حصة.</div>';
  else{const lo=Math.min(...hs),hi=Math.min(Math.max(...hs),lo+13);let g='<div></div>'+DAYS.map(d=>`<div class="hd${d===t?' td':''}">${d}</div>`).join('');
   for(let h=lo;h<=hi;h++){g+=`<div class="tm2">${pad(h)}:00</div>`;DAYS.forEach(d=>{const c=S.sched.filter(x=>x.day===d&&+x.time.slice(0,2)===h).sort((a,b)=>a.time<b.time?-1:1);g+=`<div class="cell">${c.map(x=>`<div class="wc" data-a="sday" data-v="${d}" style="background:${sc(x.subj)}">${esc(x.subj||'—')}<small>${esc(x.time)}${x.room?' · '+esc(x.room):''}</small></div>`).join('')}</div>`})}
   body=`<div class="wkg">${g}</div>`}
 }else body=`<div class="dlist">${DAYS.map((d,i)=>{const n=S.sched.filter(s=>s.day===d).length;return `<div class="dr${d===t?' td':''}" data-a="sday" data-v="${d}" style="--i:${i}"><div class="dn"><b>${d}</b>${d===t?'<span class="tag">اليوم</span>':''}</div><span class="dc">${n?n+(n===1?' حصة':' حصص'):'لا حصص'}</span><span class="dg">‹</span></div>`}).join('')}</div>`;
 return `<h2>الجدول الأسبوعي</h2><div class="row"><button class="b addbtn" data-a="nslot">＋ إضافة حصة</button></div>${tabsv}${body}`};

/* المؤقت */
let pm={mode:'work',end:0,left:25*60,run:false,iv:null,w:25,r:5};
const plen=()=>(pm.mode==='work'?pm.w:pm.r)*60;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
V.pomo=()=>{const w=pm.mode==='work',len=w?pm.w:pm.r;return `<h2>مؤقت التركيز</h2><div class="card"><div class="mut" style="text-align:center">${w?'وقت التركيز':'استراحة'}</div>

 <div class="chips" style="justify-content:center"><button class="chip" data-a="padj" data-v="-5">−5 د</button><button class="chip" data-a="padj" data-v="5">+5 د</button></div>
 <div class="row" style="justify-content:center"><button class="b" data-a="pgo">${pm.run?'⏸ إيقاف':'▶ ابدأ'}</button><button class="b s" data-a="prst">↺ إعادة</button><button class="b s" data-a="pmode">${w?'استراحة':'تركيز'}</button></div>
 <div class="lb" style="text-align:center">${w?'مدة التركيز':'مدة الاستراحة'} بالدقائق</div><div class="chips" style="justify-content:center">${(w?[10,15,20,25,30,40,45,50,60,75,90,120]:[3,5,10,15,20,30]).map(m=>`<button class="chip${m===len?' on':''}" data-a="pset" data-v="${m}">${m}</button>`).join('')}</div>
 <div class="mut" style="text-align:center;margin-top:8px">جلسات اليوم: ${S.pomo[today()]||0}</div><div class="lb" style="text-align:center">المادة</div><div class="chips" style="justify-content:center">${S.subjects.map(x=>`<button class="chip${pm.subj===x?' on':''}" data-a="psub" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>${pstats()}`};
function beep(){sOk()}
function tick(){pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000));const e=$('#tm');if(e)e.textContent=fmt(pm.left);const pr=$('#pr');if(pr)pr.style.setProperty('--p',Math.min(100,pm.left/plen()*100));
 if(pm.left<=0){clearInterval(pm.iv);pm.run=false;beep();if(pm.mode==='work'){S.pomo[today()]=(S.pomo[today()]||0)+1;S.pst=S.pst||{};const pk=today()+'|'+(pm.subj||'');S.pst[pk]=(S.pst[pk]||0)+pm.w;save()}pm.mode=pm.mode==='work'?'rest':'work';pm.left=plen();toast('انتهى الوقت');if(page==='pomo')render()}}
